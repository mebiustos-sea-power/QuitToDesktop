[Language_en]
Name=Quit to Desktop
Description=Adds Quit Sea Power to the shared Esc pause menu. A separate warning dialog requires explicit confirmation before returning to the desktop. No automatic save or mission-result finalization. English and Japanese; other languages use English. Requires Anchor Chain. Enable the mod and restart the game.

[Language_ja]
Name=Quit to Desktop
Description=共通のEscメニューに「Sea Power を終了する」を追加します。専用の警告ダイアログで確認した後、デスクトップに戻ります。自動保存やミッション結果の確定は行いません。英語・日本語に対応し、その他の言語では英語を表示します。Anchor Chainが必要です。有効にした後、ゲームを再起動してください。
